services:
  web:
    build: ./frontend
    ports:
      - "0.0.0.0:${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/station.json"]
      interval: 5s
      timeout: 3s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:80"]
    depends_on:
      web:
        condition: service_healthy
