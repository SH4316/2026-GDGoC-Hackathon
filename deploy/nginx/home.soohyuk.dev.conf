# Managed by scripts/certbot-up.sh and Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name home.soohyuk.dev;

    root /var/www/2026-hackathon-2;
    index index.html;
    gzip on;
    gzip_types application/javascript application/json text/css;

    location / {
        try_files $uri $uri/ =404;
    }
}
